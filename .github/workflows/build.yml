name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_COMMIT: 386d7c478221b7ee0c97bfe6ea61dcf65121d564
  DOTNET_VERSION: 10.0.x

jobs:
  windows:
    name: Windows (MSVC)
    runs-on: windows-2025
    env:
      BYTEFORGE_VCPKG: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read the release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "BYTEFORGE_RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Name the packages
        shell: bash
        run: echo "BYTEFORGE_PACKAGE_VERSION=${BYTEFORGE_RELEASE_VERSION:-dev-${GITHUB_SHA::7}}" >> "$GITHUB_ENV"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "${{ env.BYTEFORGE_VCPKG }}"
          git -C "${{ env.BYTEFORGE_VCPKG }}" checkout ${{ env.VCPKG_COMMIT }}
          & "${{ env.BYTEFORGE_VCPKG }}/bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force "${{ env.VCPKG_DEFAULT_BINARY_CACHE }}" | Out-Null

      - name: Restore vcpkg packages
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-windows-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-windows-${{ env.VCPKG_COMMIT }}-

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        run: |
          $env:VCPKG_ROOT = "${{ env.BYTEFORGE_VCPKG }}"
          cmake --preset windows-release -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Save vcpkg packages
        if: ${{ !cancelled() && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-windows-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}

      - name: Build
        run: cmake --build --preset windows-release

      - name: Test
        run: ctest --preset windows-release

      - name: Install
        run: cmake --install build-windows-release

      - name: Upload ByteForge
        uses: actions/upload-artifact@v4
        with:
          name: ByteForge-Windows
          if-no-files-found: error
          path: install-windows-release

      - name: Package the editor
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cmake --install build-windows-release --component Editor --prefix package-editor
          7z a -tzip "ByteForge-Editor-${BYTEFORGE_RELEASE_VERSION}-windows-x64.zip" ./package-editor/*

      - name: Upload the editor package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ByteForge-Editor-windows-x64
          if-no-files-found: error
          path: ByteForge-Editor-*.zip

      - name: Package the hub
        shell: bash
        run: |
          cmake --install build-windows-release --component Hub --prefix package-hub
          7z a -tzip "ByteForge-Hub-${BYTEFORGE_PACKAGE_VERSION}-windows-x64.zip" ./package-hub/*

      - name: Upload the hub package
        uses: actions/upload-artifact@v4
        with:
          name: ByteForge-Hub-windows-x64
          if-no-files-found: error
          path: ByteForge-Hub-*.zip

  linux:
    name: Linux (Clang, Fedora)
    runs-on: ubuntu-24.04
    container: fedora:44
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache

    steps:
      - name: Install system packages
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git gcc-c++ clang make patch perl pkgconf-pkg-config
          autoconf autoconf-archive automake libtool bison flex gperf python3
          zip unzip tar curl which diffutils findutils file libicu kernel-headers
          libXinerama-devel libXcursor-devel libXrandr-devel libXi-devel mesa-libGLU-devel
          wayland-devel libxkbcommon-devel wayland-protocols-devel
          qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtwayland
          patchelf librsvg2-tools

      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read the release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "BYTEFORGE_RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Name the packages
        shell: bash
        run: echo "BYTEFORGE_PACKAGE_VERSION=${BYTEFORGE_RELEASE_VERSION:-dev-${GITHUB_SHA::7}}" >> "$GITHUB_ENV"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$VCPKG_COMMIT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Restore vcpkg packages
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-linux-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-linux-${{ env.VCPKG_COMMIT }}-

      - name: Configure
        run: cmake --preset release

      - name: Save vcpkg packages
        if: ${{ !cancelled() && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-linux-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release

      - name: Install
        run: cmake --install build-release

      - name: Package
        run: tar -czf ByteForge-Linux.tar.gz -C install-release .

      - name: Upload ByteForge
        uses: actions/upload-artifact@v4
        with:
          name: ByteForge-Linux
          if-no-files-found: error
          path: ByteForge-Linux.tar.gz

      - name: Package the editor
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cmake --install build-release --component Editor --prefix package-editor
          tar -czf "ByteForge-Editor-${BYTEFORGE_RELEASE_VERSION}-linux-x64.tar.gz" -C package-editor .

      - name: Upload the editor package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ByteForge-Editor-linux-x64
          if-no-files-found: error
          path: ByteForge-Editor-*.tar.gz

      - name: Package the hub
        shell: bash
        run: >
          bash .github/scripts/make_hub_appimage.sh build-release "$BYTEFORGE_PACKAGE_VERSION"
          "ByteForge-Hub-${BYTEFORGE_PACKAGE_VERSION}-linux-x64.AppImage"

      - name: Upload the hub package
        uses: actions/upload-artifact@v4
        with:
          name: ByteForge-Hub-linux-x64
          if-no-files-found: error
          path: ByteForge-Hub-*.AppImage

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ windows, linux ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download the editor packages
        uses: actions/download-artifact@v4
        with:
          pattern: ByteForge-Editor-*
          path: dist
          merge-multiple: true

      - name: Download the hub packages
        uses: actions/download-artifact@v4
        with:
          pattern: ByteForge-Hub-*
          path: dist
          merge-multiple: true

      - name: Write the manifest
        run: python3 .github/scripts/make_manifest.py "${GITHUB_REF_NAME#v}" dist/manifest.json dist/ByteForge-Editor-*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi

          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "ByteForge ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag \
            $prerelease
